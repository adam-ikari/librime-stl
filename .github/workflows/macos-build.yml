name: macOS build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string
      rime_plugins:
        required: false
        type: string
jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-26-intel, macos-26]
        include:
          - runs-on: macos-26-intel
            create-distributable: false
          - runs-on: macos-26
            create-distributable: true
            build_variant: universal
    env:
      # fork: no BOOST_ROOT and no boost install step -- this fork builds
      # without Boost (std::regex + rime/*.hpp shims).
      RIME_PLUGINS: ${{ inputs.rime_plugins }}
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          submodules: recursive

      - name: Configure build environment
        run: |
          brew install ninja
          echo "CMAKE_GENERATOR=Ninja"  >> $GITHUB_ENV
          echo git_ref_name="$(git describe --always)" >> $GITHUB_ENV

      - name: Configure build variant
        if: matrix.build_variant == 'universal'
        run: |
          echo BUILD_UNIVERSAL=1 >> $GITHUB_ENV

      # fork: no Boost install step -- this fork does not require Boost.

      - name: Check submodules
        run: git submodule > submodule-status

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: |
            bin
            include
            lib
            share
          # fork: deps/opencc is vendored, not a submodule, so the submodule
          # status above cannot change when opencc changes. Hash it (and the dep
          # build flags) or a stale lib/libopencc.a outlives the version bump.
          key: ${{ runner.os }}-${{ matrix.build_variant || runner.arch }}-deps-${{ hashFiles('submodule-status', 'deps/opencc/**', 'deps.mk') }}

      - name: Build dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make deps

      - name: Install Rime plugins
        run: ./action-install-plugins-macos.sh

      - name: Build and test
        run: make test

      # fork: `make test` configures the standalone graph
      # (-DENABLE_EXTERNAL_PLUGINS=ON -DBUILD_MERGED_PLUGINS=OFF), so this runner
      # really does build librime-lua.dylib -- and nothing here had ever loaded
      # it. All three Boost replacements this fork made (the dlopen loader,
      # std::regex behind the plugin shim, the grouped connect in rime::signal)
      # only show their defects at load time: a plugin that links clean and dies
      # at dlopen is exactly the shape a link-only gate ships. Upstream's
      # workflow has no equivalent step.
      - name: Plugin runtime e2e
        run: python3 test/e2e_lua.py

      - name: Create distributable
        if: matrix.create-distributable
        run: |
          make install
          tar -cjvf rime-${{ env.git_ref_name }}-${{ runner.os }}-${{ matrix.build_variant || runner.arch }}.tar.bz2 \
          dist version-info.txt
          tar -cjvf rime-deps-${{ env.git_ref_name }}-${{ runner.os }}-${{ matrix.build_variant || runner.arch }}.tar.bz2 \
          --exclude '*/.placeholder' \
          bin include lib share

      - name: Upload artifacts
        if: matrix.create-distributable
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ runner.os }}-${{ matrix.build_variant || runner.arch }}
          path: |
            rime-${{ env.git_ref_name }}-${{ runner.os }}-${{ matrix.build_variant || runner.arch }}.tar.bz2
            rime-deps-${{ env.git_ref_name }}-${{ runner.os }}-${{ matrix.build_variant || runner.arch }}.tar.bz2
