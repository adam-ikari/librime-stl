name: dict check
on:
  pull_request:
    paths:
      - 'dict/**'
      # test/opencc/ is generated out of deps/opencc like dict/opencc/ is, so a
      # change to either can only be accepted through this gate.
      - 'test/opencc/**'
      - 'deps/opencc/**'
      - '.github/workflows/dict-check.yml'

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v5
        with:
          # convert_dict.py reads the traditional base out of history; a shallow
          # checkout cannot produce it and the diff would fail for the wrong reason.
          fetch-depth: 0
          submodules: recursive

      # The only job in this repo allowed to need a host Python and to execute a
      # host-built opencc_dict. The engine's configure/build graph must never
      # reach either -- see dict/README.md.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3

      - name: Regenerate and compare
        run: make -C dict/tools check
