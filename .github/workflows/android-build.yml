name: Android build
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install NDK
        run: |
          curl -fSL -o "$RUNNER_TEMP/ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"

      - name: Build librime.so
        run: |
          NDK="$RUNNER_TEMP/android-ndk-r28" ./build-android.sh "${{ matrix.abi }}"

      - name: Verify the artifact
        run: |
          # The same assertions build-android.sh runs at the end of a build
          # (NEEDED limited to bionic, rime_get_api exported), replayed against
          # the artifact without rebuilding. Keeping one copy is the point: a
          # second, weaker copy here is what let the README claims drift from
          # what any check actually enforced.
          VERIFY_ONLY=1 ./build-android.sh "${{ matrix.abi }}"
          file "build/android-${{ matrix.abi }}/rime/lib/librime.so"
