name: Commit CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          ./action-install-clang-format.sh 23

      - name: Code style lint
        run: make clang-format-lint

  linux:
    needs: lint
    uses: ./.github/workflows/linux-build.yml

  macos:
    needs: lint
    uses: ./.github/workflows/macos-build.yml
    with:
      # fork: hchunhui/librime-lua is out of the matrix. The plugin includes
      # <boost/regex.hpp> and registers its LuaLibrary against boost::signals2's
      # connection shape, while this fork ships no Boost and rime::connection
      # comes from <rime/signal.hpp> -- it does not compile against either.
      # octagram and predict stay in, so the external-plugin build path is still
      # covered on every platform.
      rime_plugins: lotem/librime-octagram rime/librime-predict

  windows:
    needs: lint
    uses: ./.github/workflows/windows-build.yml
    with:
      rime_plugins: lotem/librime-octagram rime/librime-predict

  android:
    needs: lint
    uses: ./.github/workflows/android-build.yml
  docker:
    needs: lint
    uses: ./.github/workflows/docker-build.yml
