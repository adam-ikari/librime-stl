name: Commit CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          ./action-install-clang-format.sh 23

      - name: Code style lint
        run: make clang-format-lint

      # fork: deps.mk's <dep>_flags table is the single source of dependency
      # configure policy (build-android.sh asks that table instead of keeping a
      # second copy), so a policy flag written back into a recipe is a silent
      # divergence between the two build graphs. This gate is cheap enough to run
      # before any compiler does.
      - name: Dependency flag policy lint
        run: make lint-deps-flags

  linux:
    needs: lint
    uses: ./.github/workflows/linux-build.yml

  macos:
    needs: lint
    uses: ./.github/workflows/macos-build.yml
    with:
      # fork: hchunhui/librime-lua is out of the matrix. The plugin includes
      # <boost/regex.hpp> and registers its LuaLibrary against boost::signals2's
      # connection shape, while this fork ships no Boost and rime::connection
      # comes from <rime/signal.hpp> -- it does not compile against either.
      # octagram and predict stay in, so the external-plugin build path is still
      # covered on every platform.
      rime_plugins: lotem/librime-octagram rime/librime-predict

  windows:
    needs: lint
    uses: ./.github/workflows/windows-build.yml
    with:
      rime_plugins: lotem/librime-octagram rime/librime-predict

  android:
    needs: lint
    uses: ./.github/workflows/android-build.yml

  # fork: every other job here takes its third-party libraries either from distro
  # packages (Linux, Docker, MinGW) or from whatever `make deps` had installed
  # into the source tree, and nothing ever said which copy a build got -- a host
  # opencc 1.1.3 can sit under a librime while dict/opencc/*.ocd2 came from the
  # vendored 1.1.9. This job is the coverage for the pinned deps themselves: the
  # find modules are restricted to a private prefix, RIME_DEPS_PREFIX fails the
  # configure if anything resolved outside it or if the opencc it finds is not
  # the vendored version, and rime_test then runs against that build.
  hermetic-deps:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build the vendored dependencies into a private prefix
        run: make deps prefix="$HOME/rime-deps"

      - name: Configure with the dependency gate on
        run: |
          cmake -S . -B build-hermetic \
            -DRIME_DEPS_PREFIX="$HOME/rime-deps" \
            -DCMAKE_PREFIX_PATH="$HOME/rime-deps" \
            -DCMAKE_FIND_ROOT_PATH="$HOME/rime-deps" \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DBUILD_TEST=ON -DBUILD_SAMPLE=OFF

      - name: Build and test
        run: |
          cmake --build build-hermetic -j"$(nproc)"
          ctest --test-dir build-hermetic --output-on-failure

  docker:
    needs: lint
    uses: ./.github/workflows/docker-build.yml
