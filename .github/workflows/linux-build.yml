name: Linux build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
        # fork: no boost exclude needed. Upstream excluded arm+clang
        # because bootstrapping Boost failed there; this fork does not build
        # Boost, so the combination is covered like every other.
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Install dependency
        run: ./action-install-linux.sh

      - name: Build and test
        run: make test
        env:
          CMAKE_GENERATOR: Ninja

      # fork: the bundled dictionary is not part of the engine build, so
      # nothing else here proves the engine can read it. Deploy dict/ for real
      # and assert candidates -- see dict/README.md.
      - name: Dictionary smoke test
        run: make -C dict/tools smoke
